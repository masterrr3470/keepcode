[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "keepcode"
dynamic = ["version"]
description = "Find every project on your computer that is not backed up, and fix it in one command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jorge Lourenço" }]
keywords = ["git", "github", "backup", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/masterrr3470/keepcode"
Issues = "https://github.com/masterrr3470/keepcode/issues"

[project.scripts]
keepcode = "keepcode.cli:main"

[tool.hatch.version]
path = "src/keepcode/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/keepcode"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "UP006", "UP007", "UP035", "UP045"]
