name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests on ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests
      - name: Test
        run: pytest -q

  windows-exe:
    name: Build keepcode.exe
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . pyinstaller==6.11.1
      - name: Build and smoke test
        run: python packaging/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: keepcode-windows-x64
          path: |
            dist/keepcode-windows-x64.exe
            dist/SHA256SUMS.txt
          retention-days: 14
