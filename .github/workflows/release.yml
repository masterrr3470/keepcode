name: Release

# Publishes the version in src/keepcode/__init__.py as a GitHub Release with
# keepcode.exe built on Windows. Start it from the Actions tab ("Run workflow")
# or by pushing a tag such as v1.2.0. Installed copies of keepcode find the new
# release the next time they open and offer to update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read the version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/keepcode/__init__.py').read()).group(1))")
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match __version__ = $version"
            exit 1
          fi
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "keepcode $version is already published. Raise __version__ first."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install
        run: python -m pip install -e ".[dev]" pyinstaller==6.11.1
      - name: Test
        run: pytest -q
      - name: Build and smoke test
        run: python packaging/build.py
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python packaging/release_notes.py "$VERSION" > notes.md
          gh release create "v$VERSION" \
            dist/keepcode-windows-x64.exe dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "keepcode $VERSION" --notes-file notes.md
