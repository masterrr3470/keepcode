name: Release

# Push a tag such as v1.2.0 to publish a new version. GitHub Actions tests it,
# builds keepcode.exe on Windows and publishes it as a GitHub Release. Installed
# copies of keepcode find it the next time they open and offer to update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the version
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+)\"', open('src/keepcode/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag $GITHUB_REF_NAME does not match __version__ = $version"
            exit 1
          fi
      - name: Install
        run: python -m pip install -e ".[dev]" pyinstaller==6.11.1
      - name: Test
        run: pytest -q
      - name: Build and smoke test
        run: python packaging/build.py
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python packaging/release_notes.py "$version" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            dist/keepcode-windows-x64.exe dist/SHA256SUMS.txt \
            --title "keepcode $version" --notes-file notes.md
